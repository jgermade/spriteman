<script :setup="{
  t,
  width,
  height,
  fps,
  zoom,
  sizes,
  onChangeCanvasSize,
  onChangeFps,
  onChangeZoom
}" type="text/typescript">
  $: standardSizes = sizes || [];
  $: currentSizeValue = `${width || 64}x${height || 64}`;

  const handleSizeChange = (e: Event) => {
    const val = (e.target as HTMLSelectElement).value;
    const [w, h] = val.split('x').map(Number);
    onChangeCanvasSize?.(w, h);
  };

  const handleFpsChange = (e: Event) => {
    const val = parseInt((e.target as HTMLSelectElement).value, 10);
    onChangeFps?.(val);
  };

  const handleZoomChange = (e: Event) => {
    const val = parseInt((e.target as HTMLSelectElement).value, 10);
    onChangeZoom?.(val);
  };
</script>

<div class="settings-panel">
  <div class="panel-header">
    <span class="panel-title">{{ t('settings.title') }}</span>
  </div>
  <div class="settings-grid">
    <!-- Canvas Pixel Size -->
    <div class="setting-item">
      <label class="setting-label">{{ t('settings.canvas_size') }}</label>
      <select class="setting-select size-select" :value="currentSizeValue" @change="handleSizeChange">
        <option :each="p in standardSizes" :key="p.labelKey" :value="`${p.width}x${p.height}`">{{ t(p.labelKey) }}</option>
      </select>
    </div>

    <!-- FPS Speed -->
    <div class="setting-item">
      <label class="setting-label">{{ t('settings.fps') }}</label>
      <div class="fps-control-group">
        <select class="setting-select fps-select" :value="String(fps || 12)" @change="handleFpsChange">
          <option value="6">{{ t('fps.6') }}</option>
          <option value="8">{{ t('fps.8') }}</option>
          <option value="12">{{ t('fps.12') }}</option>
          <option value="16">{{ t('fps.16') }}</option>
          <option value="24">{{ t('fps.24') }}</option>
          <option value="30">{{ t('fps.30') }}</option>
        </select>
      </div>
    </div>

    <!-- Pixel Zoom -->
    <div class="setting-item">
      <label class="setting-label">{{ t('settings.zoom') }}</label>
      <select class="setting-select zoom-select" :value="String(zoom || 6)" @change="handleZoomChange">
        <option value="2">2x</option>
        <option value="4">4x</option>
        <option value="6">6x</option>
        <option value="8">8x</option>
        <option value="12">12x</option>
      </select>
    </div>
  </div>
</div>
