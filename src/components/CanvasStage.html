<script :setup="{
  t,
  canvasService,
  onPaintStroke,
  onSetPivot,
  onStartTranslateLayer,
  onTranslateLayer,
  onStartMovePixel,
  onMovePixel,
  onZoomChange
}" type="text/typescript">
  const { getLinePixels, getTouchDistance, getTouchMidpoint } = await import('../helpers/canvas.helper');

  let curZoom = canvasService.getZoom();

  // Assigned once the stage is mounted; releases every window listener it registered.
  let dispose: () => void = () => {};

  canvasService.onZoom((z: number) => {
    curZoom = z;
    onZoomChange?.(z);
  });

  await $mounted();

  const root = $self('.canvas-stage-root') || document.querySelector('.canvas-stage-root');
  const canvas = root ? (root.querySelector('canvas') as HTMLCanvasElement) : null;
  const ctx = canvas ? canvas.getContext('2d') : null;

  if (root && canvas && ctx) {
    // Listeners registered on window are torn down together when the stage goes away.
    const teardown = new AbortController();
    const listen = { signal: teardown.signal };

    // Modifier key state
    let isShiftHeld = false;
    let isCtrlHeld = false;
    let isCmdHeld = false;
    let isAltHeld = false;

    let isMouseDown = false;
    let isMousePanning = false;
    let mousePanStart = { x: 0, y: 0 };

    let isMovingLayer = false;
    let layerDragStartClient = { x: 0, y: 0 };
    let layerDragTotalDisplacement = { x: 0, y: 0 };

    let isSpaceHeld = false;
    let isDraggingLoosePixel = false;
    let draggedPixelStart = { x: 0, y: 0 };
    let draggedPixelCurrent = { x: 0, y: 0 };

    let isPainting = false;
    let currentPaintColor = '#000000';
    let lastPaintedPixel: { x: number; y: number } | null = null;
    let currentStrokePixels: Array<{ x: number; y: number }> = [];

    // Touch gesture state
    let isTwoFingerGesture = false;
    let initialTouchDistance = 0;
    let initialTouchZoom = 6;
    let lastTouchMidpoint: { x: number; y: number } | null = null;

    // Viewport geometry, cached so pointer handling never forces a layout.
    let viewRect = canvas.getBoundingClientRect();
    let cssWidth = viewRect.width;
    let cssHeight = viewRect.height;
    let appliedCursor = '';

    const refreshViewRect = () => {
      viewRect = canvas.getBoundingClientRect();
    };

    const resizeSurface = (width: number, height: number) => {
      const dpr = window.devicePixelRatio || 1;
      const deviceWidth = Math.max(1, Math.round(width * dpr));
      const deviceHeight = Math.max(1, Math.round(height * dpr));
      cssWidth = width;
      cssHeight = height;
      if (canvas.width !== deviceWidth || canvas.height !== deviceHeight) {
        canvas.width = deviceWidth;
        canvas.height = deviceHeight;
      }
      // One scale for the whole surface: every draw call below works in CSS pixels.
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      refreshViewRect();
    };

    const paint = () => {
      canvasService.redraw(ctx, cssWidth, cssHeight, {
        isShiftHeld,
        isCtrlHeld,
        isCmdHeld,
        isAltHeld,
        isDragging: isMovingLayer || isDraggingLoosePixel || isMousePanning,
      });
    };

    // The service coalesces every change into a single repaint per animation frame.
    canvasService.subscribe(paint);

    const requestPaint = () => canvasService.notify();

    const updateCursor = () => {
      let next = 'crosshair';
      if (isMovingLayer || isShiftHeld) {
        next = isMovingLayer ? 'grabbing' : 'move';
      } else if (isDraggingLoosePixel) {
        next = 'grabbing';
      } else if (isCtrlHeld) {
        const hover = canvasService.getHoverPixel();
        const framePixels = canvasService.getFramePixels();
        next = hover && framePixels[`${hover.x},${hover.y}`] ? 'grab' : 'default';
      } else if (isSpaceHeld || isMousePanning) {
        next = isMousePanning ? 'grabbing' : 'grab';
      } else if (canvasService.isPivotMode()) {
        next = 'pointer';
      }
      if (next !== appliedCursor) {
        appliedCursor = next;
        root.style.cursor = next;
      }
    };

    const handleResetView = () => {
      canvasService.resetView(cssWidth, cssHeight);
    };

    const paintPixelAt = (x: number, y: number) => {
      currentStrokePixels.push({ x, y });
      canvasService.paintPixel(x, y, currentPaintColor === '__eraser__' ? null : currentPaintColor);
    };

    const paintLineTo = (pixel: { x: number; y: number }) => {
      const points = lastPaintedPixel
        ? getLinePixels(lastPaintedPixel.x, lastPaintedPixel.y, pixel.x, pixel.y)
        : [pixel];
      for (const point of points) {
        paintPixelAt(point.x, point.y);
      }
      lastPaintedPixel = pixel;
    };

    const commitStroke = () => {
      if (!isPainting) return;
      isPainting = false;
      if (currentStrokePixels.length > 0) {
        onPaintStroke?.(currentStrokePixels, currentPaintColor);
        currentStrokePixels = [];
      }
      lastPaintedPixel = null;
    };

    // Match the backing store to the element size, at device resolution.
    const resizeObserver = new ResizeObserver((entries) => {
      for (const entry of entries) {
        const { width, height } = entry.contentRect;
        if (width > 0 && height > 0) {
          resizeSurface(width, height);
          requestPaint();
        }
      }
    });
    resizeObserver.observe(root);
    resizeSurface(viewRect.width || root.clientWidth, viewRect.height || root.clientHeight);

    window.addEventListener('resize', refreshViewRect, listen);
    window.addEventListener('scroll', refreshViewRect, { passive: true, capture: true, signal: teardown.signal });

    // Keyboard modifiers
    window.addEventListener('keydown', (e: KeyboardEvent) => {
      let changed = false;
      if (e.key === 'Shift' && !isShiftHeld) {
        isShiftHeld = true;
        changed = true;
      }
      if (e.key === 'Control' && !isCtrlHeld) {
        isCtrlHeld = true;
        changed = true;
      }
      if ((e.key === 'Meta' || e.metaKey) && !isCmdHeld) {
        isCmdHeld = true;
        changed = true;
      }
      if (e.key === 'Alt' && !isAltHeld) {
        isAltHeld = true;
        changed = true;
      }
      if (e.code === 'Space' && !isSpaceHeld) {
        if (!(e.target instanceof HTMLInputElement || e.target instanceof HTMLTextAreaElement || e.target instanceof HTMLSelectElement)) {
          isSpaceHeld = true;
          changed = true;
        }
      }
      if (changed) {
        updateCursor();
        requestPaint();
      }
    }, listen);

    window.addEventListener('keyup', (e: KeyboardEvent) => {
      let changed = false;
      if (e.key === 'Shift') {
        isShiftHeld = false;
        changed = true;
      }
      if (e.key === 'Control') {
        isCtrlHeld = false;
        changed = true;
      }
      if (e.key === 'Meta') {
        isCmdHeld = false;
        changed = true;
      }
      if (e.key === 'Alt') {
        isAltHeld = false;
        changed = true;
      }
      if (e.code === 'Space') {
        isSpaceHeld = false;
        changed = true;
      }
      if (changed) {
        updateCursor();
        requestPaint();
      }
    }, listen);

    window.addEventListener('blur', () => {
      isShiftHeld = false;
      isCtrlHeld = false;
      isCmdHeld = false;
      isAltHeld = false;
      isMouseDown = false;
      isMousePanning = false;
      isSpaceHeld = false;
      isDraggingLoosePixel = false;
      updateCursor();
      requestPaint();
    }, listen);

    // Touch handlers
    root.addEventListener(
      'touchstart',
      (e: TouchEvent) => {
        refreshViewRect();
        if (e.touches.length === 2) {
          e.preventDefault();
          isTwoFingerGesture = true;
          isPainting = false;
          initialTouchDistance = getTouchDistance(e.touches[0], e.touches[1]);
          initialTouchZoom = canvasService.getZoom();
          lastTouchMidpoint = getTouchMidpoint(e.touches[0], e.touches[1]);
        } else if (e.touches.length === 1 && !isTwoFingerGesture) {
          const pixel = canvasService.getSpritePixelAtPointer(e.touches[0].clientX, e.touches[0].clientY, viewRect);
          if (pixel) {
            isPainting = true;
            lastPaintedPixel = pixel;
            currentStrokePixels = [];
            currentPaintColor = canvasService.getColors().primary;
            paintPixelAt(pixel.x, pixel.y);
          }
        }
      },
      { passive: false, signal: teardown.signal }
    );

    root.addEventListener(
      'touchmove',
      (e: TouchEvent) => {
        if (isTwoFingerGesture && e.touches.length === 2) {
          e.preventDefault();
          const currentDist = getTouchDistance(e.touches[0], e.touches[1]);
          if (initialTouchDistance > 0) {
            canvasService.setZoom(initialTouchZoom * (currentDist / initialTouchDistance));
          }

          const currentMid = getTouchMidpoint(e.touches[0], e.touches[1]);
          if (lastTouchMidpoint) {
            canvasService.pan(currentMid.x - lastTouchMidpoint.x, currentMid.y - lastTouchMidpoint.y);
          }
          lastTouchMidpoint = currentMid;
        } else if (isPainting && e.touches.length === 1) {
          e.preventDefault();
          const pixel = canvasService.getSpritePixelAtPointer(e.touches[0].clientX, e.touches[0].clientY, viewRect);
          if (pixel) {
            paintLineTo(pixel);
          }
        }
      },
      { passive: false, signal: teardown.signal }
    );

    const endTouch = () => {
      commitStroke();
      isTwoFingerGesture = false;
      lastTouchMidpoint = null;
    };
    root.addEventListener('touchend', endTouch, listen);
    root.addEventListener('touchcancel', endTouch, listen);

    // Wheel: scroll pans, Ctrl/Cmd + scroll zooms around the pointer.
    root.addEventListener(
      'wheel',
      (e: WheelEvent) => {
        e.preventDefault();
        if (e.ctrlKey || e.metaKey) {
          refreshViewRect();
          canvasService.zoomAtPoint(Math.exp(-e.deltaY * 0.02), e.clientX, e.clientY, viewRect);
        } else {
          canvasService.pan(-e.deltaX, -e.deltaY);
        }
      },
      { passive: false, signal: teardown.signal }
    );

    // Mouse interactions
    root.addEventListener('mousedown', (e: MouseEvent) => {
      refreshViewRect();
      isMouseDown = true;
      isShiftHeld = e.shiftKey;
      isCtrlHeld = e.ctrlKey;
      isCmdHeld = e.metaKey;
      isAltHeld = e.altKey;

      // 1. SHIFT: drag the layer contents
      if (isShiftHeld && e.button === 0) {
        e.preventDefault();
        isMovingLayer = true;
        layerDragStartClient = { x: e.clientX, y: e.clientY };
        layerDragTotalDisplacement = { x: 0, y: 0 };
        updateCursor();
        onStartTranslateLayer?.();
        requestPaint();
        return;
      }

      // 2. Space or middle click: pan the canvas
      if (isSpaceHeld || e.button === 1) {
        e.preventDefault();
        isMousePanning = true;
        mousePanStart = { x: e.clientX, y: e.clientY };
        updateCursor();
        return;
      }

      // 3. CTRL: drag a single loose pixel
      if (isCtrlHeld && e.button === 0) {
        const pixel = canvasService.getSpritePixelAtPointer(e.clientX, e.clientY, viewRect);
        if (pixel && canvasService.getFramePixels()[`${pixel.x},${pixel.y}`]) {
          e.preventDefault();
          isDraggingLoosePixel = true;
          draggedPixelStart = { x: pixel.x, y: pixel.y };
          draggedPixelCurrent = { x: pixel.x, y: pixel.y };
          updateCursor();
          onStartMovePixel?.(pixel.x, pixel.y);
          return;
        }
      }

      if (canvasService.isPivotMode() && e.button === 0) {
        e.preventDefault();
        const pixel = canvasService.getSpritePixelAtPointer(e.clientX, e.clientY, viewRect);
        if (pixel) {
          canvasService.setPivot({ x: pixel.x, y: pixel.y });
          onSetPivot?.(pixel.x, pixel.y);
        }
        return;
      }

      if (e.button === 0 || e.button === 2) {
        e.preventDefault();
        const pixel = canvasService.getSpritePixelAtPointer(e.clientX, e.clientY, viewRect);
        if (pixel) {
          isPainting = true;
          const colors = canvasService.getColors();
          currentPaintColor = e.button === 2 ? colors.secondary : colors.primary;
          lastPaintedPixel = pixel;
          currentStrokePixels = [];
          paintPixelAt(pixel.x, pixel.y);
        }
      }
    }, listen);

    window.addEventListener('mousemove', (e: MouseEvent) => {
      isShiftHeld = e.shiftKey;
      isCtrlHeld = e.ctrlKey;
      isCmdHeld = e.metaKey;
      isAltHeld = e.altKey;

      if (isMovingLayer) {
        const z = canvasService.getZoom();
        const totalDx = Math.round((e.clientX - layerDragStartClient.x) / z);
        const totalDy = Math.round((e.clientY - layerDragStartClient.y) / z);
        const stepDx = totalDx - layerDragTotalDisplacement.x;
        const stepDy = totalDy - layerDragTotalDisplacement.y;
        if (stepDx !== 0 || stepDy !== 0) {
          layerDragTotalDisplacement.x = totalDx;
          layerDragTotalDisplacement.y = totalDy;
          onTranslateLayer?.(stepDx, stepDy, false);
        }
        return;
      }

      if (isMousePanning) {
        canvasService.pan(e.clientX - mousePanStart.x, e.clientY - mousePanStart.y);
        mousePanStart = { x: e.clientX, y: e.clientY };
        return;
      }

      if (isDraggingLoosePixel) {
        const pixel = canvasService.getSpritePixelAtPointer(e.clientX, e.clientY, viewRect);
        if (pixel && (pixel.x !== draggedPixelCurrent.x || pixel.y !== draggedPixelCurrent.y)) {
          draggedPixelCurrent = { x: pixel.x, y: pixel.y };
          onMovePixel?.(draggedPixelStart.x, draggedPixelStart.y, pixel.x, pixel.y, false);
        }
        return;
      }

      if (isPainting) {
        const pixel = canvasService.getSpritePixelAtPointer(e.clientX, e.clientY, viewRect);
        if (pixel && (!lastPaintedPixel || lastPaintedPixel.x !== pixel.x || lastPaintedPixel.y !== pixel.y)) {
          paintLineTo(pixel);
          canvasService.setHoverPixel(pixel);
        }
        return;
      }

      canvasService.setHoverPixel(canvasService.getSpritePixelAtPointer(e.clientX, e.clientY, viewRect));
      updateCursor();
    }, listen);

    root.addEventListener('mouseleave', () => {
      if (isMovingLayer) {
        isMovingLayer = false;
        onTranslateLayer?.(0, 0, true);
        updateCursor();
        requestPaint();
      }
      if (isDraggingLoosePixel) {
        isDraggingLoosePixel = false;
        onMovePixel?.(draggedPixelStart.x, draggedPixelStart.y, draggedPixelCurrent.x, draggedPixelCurrent.y, true);
        updateCursor();
      }
      canvasService.setHoverPixel(null);
    }, listen);

    window.addEventListener('mouseup', () => {
      isMouseDown = false;
      if (isMovingLayer) {
        isMovingLayer = false;
        onTranslateLayer?.(0, 0, true);
        updateCursor();
        requestPaint();
      }

      if (isMousePanning) {
        isMousePanning = false;
      }

      if (isDraggingLoosePixel) {
        isDraggingLoosePixel = false;
        onMovePixel?.(draggedPixelStart.x, draggedPixelStart.y, draggedPixelCurrent.x, draggedPixelCurrent.y, true);
      }

      commitStroke();
      updateCursor();
    }, listen);

    root.addEventListener('contextmenu', (e: MouseEvent) => {
      e.preventDefault();
    }, listen);

    root.addEventListener('dblclick', () => {
      handleResetView();
    }, listen);

    const resetBtn = root.querySelector('.btn-reset-view');
    if (resetBtn) {
      resetBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        handleResetView();
      }, listen);
    }

    // Exposed on the component store so a host that unmounts the stage can release
    // every window listener it registered.
    dispose = () => {
      teardown.abort();
      resizeObserver.disconnect();
    };
  }
</script>

<div class="canvas-stage-root">
  <canvas class="stage-canvas-full"></canvas>

  <div class="canvas-hud-overlay">
    <div class="hud-left">
      <span class="hud-zoom-badge">{{ Math.round(curZoom) }}x</span>
      <button class="btn-hud-tool btn-reset-view" :title="t('canvas.reset_title')">{{ t('canvas.reset') }}</button>
    </div>
    <div class="hud-hint">{{ t('canvas.hint') }}</div>
  </div>
</div>
