<script :setup="{
  canvasService,
  onPaintStroke,
  onSetPivot,
  onStartTranslateLayer,
  onTranslateLayer,
  onStartMovePixel,
  onMovePixel,
  onZoomChange
}" type="text/typescript">
  const getTouchDistance = (t1: Touch, t2: Touch): number => {
    return Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
  };

  const getTouchMidpoint = (t1: Touch, t2: Touch): { x: number; y: number } => {
    return {
      x: (t1.clientX + t2.clientX) / 2,
      y: (t1.clientY + t2.clientY) / 2,
    };
  };

  const getLinePixels = (x0: number, y0: number, x1: number, y1: number): Array<{ x: number; y: number }> => {
    const pixels: Array<{ x: number; y: number }> = [];
    const dx = Math.abs(x1 - x0);
    const dy = Math.abs(y1 - y0);
    const sx = x0 < x1 ? 1 : -1;
    const sy = y0 < y1 ? 1 : -1;
    let err = dx - dy;
    let cx = x0;
    let cy = y0;
    while (true) {
      pixels.push({ x: cx, y: cy });
      if (cx === x1 && cy === y1) break;
      const e2 = 2 * err;
      if (e2 > -dy) {
        err -= dy;
        cx += sx;
      }
      if (e2 < dx) {
        err += dx;
        cy += sy;
      }
    }
    return pixels;
  };

  let curZoom = canvasService.getZoom();

  canvasService.onZoom((z: number) => {
    curZoom = z;
    onZoomChange?.(z);
  });

  await $mounted();

  const root = $self('.canvas-stage-root') || document.querySelector('.canvas-stage-root');
  const canvas = root ? (root.querySelector('canvas') as HTMLCanvasElement) : null;
  const ctx = canvas ? canvas.getContext('2d') : null;

  if (root && canvas && ctx) {
    // Modifier keys state
    let isShiftHeld = false;
    let isCtrlHeld = false;
    let isCmdHeld = false;
    let isAltHeld = false;

    let isMouseDown = false;
    let isMousePanning = false;
    let mousePanStart = { x: 0, y: 0 };

    let isMovingLayer = false;
    let layerDragStartClient = { x: 0, y: 0 };
    let layerDragTotalDisplacement = { x: 0, y: 0 };

    let isSpaceHeld = false;
    let isDraggingLoosePixel = false;
    let draggedPixelStart = { x: 0, y: 0 };
    let draggedPixelCurrent = { x: 0, y: 0 };

    let isPainting = false;
    let currentPaintColor = '#000000';
    let lastPaintedPixel: { x: number; y: number } | null = null;
    let currentStrokePixels: Array<{ x: number; y: number }> = [];

    // Touch gesture state
    let isTwoFingerGesture = false;
    let initialTouchDistance = 0;
    let initialTouchZoom = 6;
    let lastTouchMidpoint: { x: number; y: number } | null = null;

    const triggerRedraw = () => {
      canvasService.redraw(ctx, canvas.width, canvas.height, {
        isShiftHeld,
        isCtrlHeld,
        isCmdHeld,
        isAltHeld,
        isDragging: isMovingLayer || isDraggingLoosePixel || isMousePanning,
      });
    };

    canvasService.subscribe(() => {
      triggerRedraw();
    });

    const updateCursor = () => {
      if (isMovingLayer || isShiftHeld) {
        root.style.cursor = isMovingLayer ? 'grabbing' : 'move';
        return;
      }
      if (isDraggingLoosePixel) {
        root.style.cursor = 'grabbing';
        return;
      }
      if (isCtrlHeld) {
        const hover = canvasService.getHoverPixel();
        const framePixels = canvasService.getFramePixels();
        if (hover && framePixels[`${hover.x},${hover.y}`]) {
          root.style.cursor = 'grab';
        } else {
          root.style.cursor = 'default';
        }
        return;
      }
      if (isSpaceHeld || isMousePanning) {
        root.style.cursor = isMousePanning ? 'grabbing' : 'grab';
        return;
      }
      if (canvasService.isPivotMode()) {
        root.style.cursor = 'pointer';
        return;
      }
      root.style.cursor = 'crosshair';
    };

    const handleResetView = () => {
      const rect = canvas.getBoundingClientRect();
      canvasService.resetView(rect.width, rect.height);
    };

    // ResizeObserver for responsive full canvas resolution matching 1:1 CSS pixels
    const resizeObserver = new ResizeObserver((entries) => {
      for (const entry of entries) {
        const { width, height } = entry.contentRect;
        if (width > 0 && height > 0) {
          canvas.width = Math.round(width);
          canvas.height = Math.round(height);
          triggerRedraw();
        }
      }
    });
    resizeObserver.observe(root);

    // Keyboard modifiers
    window.addEventListener('keydown', (e: KeyboardEvent) => {
      let changed = false;
      if (e.key === 'Shift' && !isShiftHeld) {
        isShiftHeld = true;
        changed = true;
      }
      if (e.key === 'Control' && !isCtrlHeld) {
        isCtrlHeld = true;
        changed = true;
      }
      if ((e.key === 'Meta' || e.metaKey) && !isCmdHeld) {
        isCmdHeld = true;
        changed = true;
      }
      if (e.key === 'Alt' && !isAltHeld) {
        isAltHeld = true;
        changed = true;
      }
      if (e.code === 'Space' && !isSpaceHeld) {
        if (!(e.target instanceof HTMLInputElement || e.target instanceof HTMLTextAreaElement || e.target instanceof HTMLSelectElement)) {
          isSpaceHeld = true;
          changed = true;
        }
      }
      if (changed) {
        updateCursor();
        triggerRedraw();
      }
    });

    window.addEventListener('keyup', (e: KeyboardEvent) => {
      let changed = false;
      if (e.key === 'Shift') {
        isShiftHeld = false;
        changed = true;
      }
      if (e.key === 'Control') {
        isCtrlHeld = false;
        changed = true;
      }
      if (e.key === 'Meta') {
        isCmdHeld = false;
        changed = true;
      }
      if (e.key === 'Alt') {
        isAltHeld = false;
        changed = true;
      }
      if (e.code === 'Space') {
        isSpaceHeld = false;
        changed = true;
      }
      if (changed) {
        updateCursor();
        triggerRedraw();
      }
    });

    window.addEventListener('blur', () => {
      isShiftHeld = false;
      isCtrlHeld = false;
      isCmdHeld = false;
      isAltHeld = false;
      isMouseDown = false;
      isMousePanning = false;
      isSpaceHeld = false;
      isDraggingLoosePixel = false;
      updateCursor();
      triggerRedraw();
    });

    // Touch handlers
    root.addEventListener(
      'touchstart',
      (e: TouchEvent) => {
        if (e.touches.length === 2) {
          e.preventDefault();
          isTwoFingerGesture = true;
          isPainting = false;
          initialTouchDistance = getTouchDistance(e.touches[0], e.touches[1]);
          initialTouchZoom = canvasService.getZoom();
          lastTouchMidpoint = getTouchMidpoint(e.touches[0], e.touches[1]);
        } else if (e.touches.length === 1 && !isTwoFingerGesture) {
          const rect = canvas.getBoundingClientRect();
          const pixel = canvasService.getSpritePixelAtPointer(e.touches[0].clientX, e.touches[0].clientY, rect, canvas.width, canvas.height);
          if (pixel) {
            isPainting = true;
            lastPaintedPixel = pixel;
            currentStrokePixels = [pixel];
            const colors = canvasService.getColors();
            currentPaintColor = colors.primary;
            const framePixels = canvasService.getFramePixels();
            if (currentPaintColor === '__eraser__') {
              delete framePixels[`${pixel.x},${pixel.y}`];
            } else {
              framePixels[`${pixel.x},${pixel.y}`] = currentPaintColor;
            }
            triggerRedraw();
          }
        }
      },
      { passive: false }
    );

    root.addEventListener(
      'touchmove',
      (e: TouchEvent) => {
        if (isTwoFingerGesture && e.touches.length === 2) {
          e.preventDefault();
          const currentDist = getTouchDistance(e.touches[0], e.touches[1]);
          if (initialTouchDistance > 0) {
            const scale = currentDist / initialTouchDistance;
            canvasService.setZoom(initialTouchZoom * scale);
          }

          const currentMid = getTouchMidpoint(e.touches[0], e.touches[1]);
          if (lastTouchMidpoint) {
            const dx = currentMid.x - lastTouchMidpoint.x;
            const dy = currentMid.y - lastTouchMidpoint.y;
            canvasService.pan(dx, dy);
          }
          lastTouchMidpoint = currentMid;
          triggerRedraw();
        } else if (isPainting && e.touches.length === 1) {
          e.preventDefault();
          const rect = canvas.getBoundingClientRect();
          const pixel = canvasService.getSpritePixelAtPointer(e.touches[0].clientX, e.touches[0].clientY, rect, canvas.width, canvas.height);
          if (pixel) {
            const points = lastPaintedPixel
              ? getLinePixels(lastPaintedPixel.x, lastPaintedPixel.y, pixel.x, pixel.y)
              : [pixel];
            const framePixels = canvasService.getFramePixels();
            for (const pt of points) {
              currentStrokePixels.push(pt);
              if (currentPaintColor === '__eraser__') {
                delete framePixels[`${pt.x},${pt.y}`];
              } else {
                framePixels[`${pt.x},${pt.y}`] = currentPaintColor;
              }
            }
            lastPaintedPixel = pixel;
            triggerRedraw();
          }
        }
      },
      { passive: false }
    );

    const endTouch = () => {
      if (isPainting) {
        isPainting = false;
        if (currentStrokePixels.length > 0) {
          onPaintStroke?.(currentStrokePixels, currentPaintColor);
          currentStrokePixels = [];
        }
        lastPaintedPixel = null;
      }
      isTwoFingerGesture = false;
      lastTouchMidpoint = null;
    };
    root.addEventListener('touchend', endTouch);
    root.addEventListener('touchcancel', endTouch);

    // Wheel zooming / panning
    root.addEventListener(
      'wheel',
      (e: WheelEvent) => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        if (e.ctrlKey || e.metaKey) {
          const zoomDelta = -e.deltaY * 0.02;
          canvasService.zoomAtPoint(Math.exp(zoomDelta), e.clientX, e.clientY, rect, canvas.width, canvas.height);
        } else {
          canvasService.pan(-e.deltaX, -e.deltaY);
        }
      },
      { passive: false }
    );

    // Mouse interactions
    root.addEventListener('mousedown', (e: MouseEvent) => {
      isMouseDown = true;
      isShiftHeld = e.shiftKey;
      isCtrlHeld = e.ctrlKey;
      isCmdHeld = e.metaKey;
      isAltHeld = e.altKey;

      // 1. SHIFT: arrastra el contenido de la capa
      if (isShiftHeld && e.button === 0) {
        e.preventDefault();
        isMovingLayer = true;
        layerDragStartClient = { x: e.clientX, y: e.clientY };
        layerDragTotalDisplacement = { x: 0, y: 0 };
        updateCursor();
        onStartTranslateLayer?.();
        triggerRedraw();
        return;
      }

      // 2. Space or Middle-click: Pan canvas
      if (isSpaceHeld || e.button === 1) {
        e.preventDefault();
        isMousePanning = true;
        mousePanStart = { x: e.clientX, y: e.clientY };
        updateCursor();
        return;
      }

      // 3. CTRL: arrastra pixeles sueltos
      if (isCtrlHeld && e.button === 0) {
        const rect = canvas.getBoundingClientRect();
        const pixel = canvasService.getSpritePixelAtPointer(e.clientX, e.clientY, rect, canvas.width, canvas.height);
        if (pixel) {
          const framePixels = canvasService.getFramePixels();
          const color = framePixels[`${pixel.x},${pixel.y}`];
          if (color) {
            e.preventDefault();
            isDraggingLoosePixel = true;
            draggedPixelStart = { x: pixel.x, y: pixel.y };
            draggedPixelCurrent = { x: pixel.x, y: pixel.y };
            updateCursor();
            onStartMovePixel?.(pixel.x, pixel.y);
            return;
          }
        }
      }

      const rect = canvas.getBoundingClientRect();

      if (canvasService.isPivotMode() && e.button === 0) {
        e.preventDefault();
        const pixel = canvasService.getSpritePixelAtPointer(e.clientX, e.clientY, rect, canvas.width, canvas.height);
        if (pixel) {
          canvasService.setPivot({ x: pixel.x, y: pixel.y });
          onSetPivot?.(pixel.x, pixel.y);
        }
        return;
      }

      if (e.button === 0 || e.button === 2) {
        e.preventDefault();
        const pixel = canvasService.getSpritePixelAtPointer(e.clientX, e.clientY, rect, canvas.width, canvas.height);
        if (pixel) {
          isPainting = true;
          const colors = canvasService.getColors();
          const isRightClick = e.button === 2;
          currentPaintColor = isRightClick ? colors.secondary : colors.primary;
          lastPaintedPixel = pixel;
          currentStrokePixels = [pixel];

          const framePixels = canvasService.getFramePixels();
          if (currentPaintColor === '__eraser__') {
            delete framePixels[`${pixel.x},${pixel.y}`];
          } else {
            framePixels[`${pixel.x},${pixel.y}`] = currentPaintColor;
          }
          triggerRedraw();
        }
      }
    });

    window.addEventListener('mousemove', (e: MouseEvent) => {
      isShiftHeld = e.shiftKey;
      isCtrlHeld = e.ctrlKey;
      isCmdHeld = e.metaKey;
      isAltHeld = e.altKey;

      if (isMovingLayer) {
        const z = canvasService.getZoom();
        const totalDx = Math.round((e.clientX - layerDragStartClient.x) / z);
        const totalDy = Math.round((e.clientY - layerDragStartClient.y) / z);
        const stepDx = totalDx - layerDragTotalDisplacement.x;
        const stepDy = totalDy - layerDragTotalDisplacement.y;
        if (stepDx !== 0 || stepDy !== 0) {
          layerDragTotalDisplacement.x = totalDx;
          layerDragTotalDisplacement.y = totalDy;
          onTranslateLayer?.(stepDx, stepDy, false);
        }
        return;
      }

      if (isMousePanning) {
        const dx = e.clientX - mousePanStart.x;
        const dy = e.clientY - mousePanStart.y;
        canvasService.pan(dx, dy);
        mousePanStart = { x: e.clientX, y: e.clientY };
        return;
      }

      const rect = root.getBoundingClientRect();

      if (isDraggingLoosePixel) {
        const pixel = canvasService.getSpritePixelAtPointer(e.clientX, e.clientY, rect, canvas.width, canvas.height);
        if (pixel && (pixel.x !== draggedPixelCurrent.x || pixel.y !== draggedPixelCurrent.y)) {
          draggedPixelCurrent = { x: pixel.x, y: pixel.y };
          onMovePixel?.(draggedPixelStart.x, draggedPixelStart.y, pixel.x, pixel.y, false);
        }
        return;
      }

      if (isPainting) {
        const pixel = canvasService.getSpritePixelAtPointer(e.clientX, e.clientY, rect);
        if (pixel) {
          if (!lastPaintedPixel || lastPaintedPixel.x !== pixel.x || lastPaintedPixel.y !== pixel.y) {
            const points = lastPaintedPixel
              ? getLinePixels(lastPaintedPixel.x, lastPaintedPixel.y, pixel.x, pixel.y)
              : [pixel];
            const framePixels = canvasService.getFramePixels();
            for (const pt of points) {
              currentStrokePixels.push(pt);
              if (currentPaintColor === '__eraser__') {
                delete framePixels[`${pt.x},${pt.y}`];
              } else {
                framePixels[`${pt.x},${pt.y}`] = currentPaintColor;
              }
            }
            lastPaintedPixel = pixel;
            canvasService.setHoverPixel(pixel);
            triggerRedraw();
          }
        }
        return;
      }

      const hover = canvasService.getSpritePixelAtPointer(e.clientX, e.clientY, rect);
      canvasService.setHoverPixel(hover);

      updateCursor();
    });

    root.addEventListener('mouseleave', () => {
      if (isMovingLayer) {
        isMovingLayer = false;
        onTranslateLayer?.(0, 0, true);
        updateCursor();
        triggerRedraw();
      }
      if (isDraggingLoosePixel) {
        isDraggingLoosePixel = false;
        onMovePixel?.(draggedPixelStart.x, draggedPixelStart.y, draggedPixelCurrent.x, draggedPixelCurrent.y, true);
        updateCursor();
      }
      canvasService.setHoverPixel(null);
    });

    window.addEventListener('mouseup', (e: MouseEvent) => {
      isMouseDown = false;
      if (isMovingLayer) {
        isMovingLayer = false;
        onTranslateLayer?.(0, 0, true);
        updateCursor();
        triggerRedraw();
      }

      if (isMousePanning) {
        isMousePanning = false;
      }

      if (isDraggingLoosePixel) {
        isDraggingLoosePixel = false;
        onMovePixel?.(draggedPixelStart.x, draggedPixelStart.y, draggedPixelCurrent.x, draggedPixelCurrent.y, true);
      }

      if (isPainting) {
        isPainting = false;
        if (currentStrokePixels.length > 0) {
          onPaintStroke?.(currentStrokePixels, currentPaintColor);
          currentStrokePixels = [];
        }
        lastPaintedPixel = null;
      }

      updateCursor();
    });

    root.addEventListener('contextmenu', (e: MouseEvent) => {
      e.preventDefault();
    });

    root.addEventListener('dblclick', () => {
      handleResetView();
    });

    const resetBtn = root.querySelector('.btn-reset-view');
    if (resetBtn) {
      resetBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        handleResetView();
      });
    }
  }
</script>

<div class="canvas-stage-root">
  <canvas class="stage-canvas-full"></canvas>

  <div class="canvas-hud-overlay">
    <div class="hud-left">
      <span class="hud-zoom-badge">{{ Math.round(curZoom) }}x</span>
      <button class="btn-hud-tool btn-reset-view" title="Recenter View (Double Tap/Click)">🎯 Reset</button>
    </div>
    <div class="hud-hint">SHIFT: Arrastrar Capa • CTRL: Arrastrar Píxel • Espacio: Desplazar Canvas • Rueda: Zoom</div>
  </div>
</div>
