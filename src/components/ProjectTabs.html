<script :setup="{ tabs, activeTab, onSelectTab, onCloseTab, onNewTab }" type="text/typescript">
  const handleSelect = (tabId: string) => {
    onSelectTab?.(tabId);
  };

  const handleClose = (e: MouseEvent, tabId: string) => {
    e.stopPropagation();
    onCloseTab?.(tabId);
  };

  const handleNew = () => {
    onNewTab?.();
  };
</script>

<div class="project-tabs-strip">
  <div class="tabs-list">
    <div
      :each="tabId in (tabs || [])"
      :key="tabId"
      class="tab-item"
      :class="{ active: tabId === activeTab }"
      @click="handleSelect(tabId)"
    >
      <span class="tab-title">📄 {{ tabId }}</span>
      <button class="tab-close" title="Close tab" @click="handleClose($event, tabId)">✕</button>
    </div>
  </div>
  <button class="btn-new-tab" title="Create or open new project" @click="handleNew">+</button>
</div>
