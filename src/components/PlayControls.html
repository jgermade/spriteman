<script :setup="{
  currentFrame,
  totalFrames,
  isPlaying,
  frameText,
  onTogglePlay,
  onSeek,
  onStep
}" type="text/typescript">
  $: curF = currentFrame || 0;
  $: totF = totalFrames || 4;
  $: playBtnText = isPlaying ? '⏸ Pause' : '▶ Play';

  const handleSlider = (e: Event) => {
    const val = parseFloat((e.target as HTMLInputElement).value);
    onSeek?.(val);
  };
</script>

<div class="controls-bar">
  <button class="btn-step btn-prev" title="Step Back" @click="onStep?.(-1)">⏮</button>
  <button class="btn-play primary" title="Play/Pause" @click="onTogglePlay?.()">{{ playBtnText }}</button>
  <button class="btn-step btn-next" title="Step Forward" @click="onStep?.(1)">⏭</button>
  <input
    type="range"
    class="scrubber"
    min="0"
    :max="String(totF)"
    step="0.1"
    :value="curF.toFixed(1)"
    @input="handleSlider"
  />
  <span class="frame-label">{{ frameText || '' }}</span>
</div>
