<script :setup="{
  t,
  isOpen,
  currentTab,
  savedFiles,
  sizes,
  onCreate,
  onOpen,
  onLoadSample,
  onImportJson,
  onClose
}" type="text/typescript">
  let projectName = 'sprite_character_1';
  let canvasSize = '64x64';
  let fps = '12';

  $: standardSizes = sizes || [];

  const handleCreate = () => {
    const name = projectName.trim() || 'pixel_sprite';
    const [w, h] = canvasSize.split('x').map(Number);
    const speed = parseInt(fps, 10) || 12;
    onCreate?.(name, w, h, speed);
  };

  const handleOpen = (filename: string) => {
    onOpen?.(filename);
  };

  const handleSample = () => {
    onLoadSample?.();
  };

  const handleFileInput = (e: Event) => {
    const file = (e.target as HTMLInputElement).files?.[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = () => {
        onImportJson?.(reader.result as string);
      };
      reader.readAsText(file);
    }
  };

  const formatDate = (t: number) => new Date(t).toLocaleDateString();
</script>

<div class="modal-backdrop" :style="`display: ${isOpen ? 'flex' : 'none'};`">
  <div class="modal-dialog">
    <div class="modal-header">
      <div class="modal-tabs">
        <button
          class="modal-tab"
          :class="{ active: currentTab === 'new' || !currentTab }"
          @click="currentTab = 'new'"
        >
          {{ t('modal.new_tab') }}
        </button>
        <button
          class="modal-tab"
          :class="{ active: currentTab === 'open' }"
          @click="currentTab = 'open'"
        >
          {{ t('modal.open_tab', { count: savedFiles ? savedFiles.length : 0 }) }}
        </button>
      </div>
      <button class="modal-close" :title="t('modal.close_title')" @click="onClose?.()">✕</button>
    </div>

    <div class="modal-body">
      <!-- New Tab -->
      <div :if="currentTab === 'new' || !currentTab">
        <div class="form-group">
          <label class="form-label">{{ t('modal.project_name') }}</label>
          <input
            id="input-project-name"
            type="text"
            class="form-input"
            :value="projectName"
            @input="projectName = $event.target.value"
            :placeholder="t('modal.project_name_placeholder')"
          />
        </div>

        <div class="form-group">
          <label class="form-label">{{ t('modal.canvas_size') }}</label>
          <select
            id="select-project-size"
            class="form-select"
            :value="canvasSize"
            @change="canvasSize = $event.target.value"
          >
            <option
              :each="p in standardSizes"
              :key="p.labelKey"
              :value="`${p.width}x${p.height}`"
            >{{ t(p.labelKey) }}</option>
          </select>
          <span class="form-hint">{{ t('modal.create_hint') }}</span>
        </div>

        <div class="form-group">
          <label class="form-label">{{ t('modal.fps') }}</label>
          <select
            id="select-project-fps"
            class="form-select"
            :value="fps"
            @change="fps = $event.target.value"
          >
            <option value="6">{{ t('fps.6') }}</option>
            <option value="8">{{ t('fps.8') }}</option>
            <option value="12">{{ t('fps.12') }}</option>
            <option value="16">{{ t('fps.16') }}</option>
            <option value="24">{{ t('fps.24') }}</option>
          </select>
        </div>

        <div class="modal-footer">
          <button id="btn-create-project" class="btn-primary" @click="handleCreate">
            {{ t('modal.create_button') }}
          </button>
        </div>
      </div>

      <!-- Open Tab -->
      <div :else class="open-section">
        <span class="section-title">{{ t('modal.storage_badge') }}</span>

        <div :if="!savedFiles || savedFiles.length === 0" class="empty-file-list">
          No saved projects found in WASMFS yet.
        </div>
        <div :else class="file-list">
          <div :each="f in savedFiles" :key="f.name" class="file-item">
            <div class="file-info">
              <span class="file-name">📄 {{ f.name }}</span>
              <span class="file-date">{{ formatDate(f.updatedAt) }}</span>
            </div>
            <button class="btn-open-file" @click="handleOpen(f.name)">{{ t('modal.open') }}</button>
          </div>
        </div>

        <div class="divider"></div>

        <div class="external-actions">
          <button id="btn-open-sample" class="btn-secondary" @click="handleSample">
            {{ t('modal.sample') }}
          </button>

          <label class="btn-secondary file-upload-label">
            {{ t('modal.import') }}
            <input id="file-upload-json" type="file" accept=".json" style="display: none;" @change="handleFileInput" />
          </label>
        </div>
      </div>
    </div>
  </div>
</div>
