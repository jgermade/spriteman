<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Spritemotion — Pixel Art Sprite Animator</title>

  <!-- PWA Meta Tags -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#070a10" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Spritemotion" />
  <link rel="icon" type="image/svg+xml" href="./icon-192.svg" />
  <link rel="alternate icon" href="./favicon.ico" />
  <link rel="apple-touch-icon" href="./icon-192.svg" />

  <!-- Typography: loaded without blocking first paint; the service worker keeps a copy
       so an installed app keeps its type offline. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    media="print"
    onload="this.media='all'"
  />
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </noscript>

  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <!-- EditorView will mount here -->
  </div>

  <script type="module">
    import EditorView from './views/EditorView.html';
    import { pwaService } from './services/pwa.service.js';

    async function bootstrap() {
      const app = document.getElementById('app');
      EditorView.mount(app);

      await pwaService.registerServiceWorker();
    }

    bootstrap().catch(console.error);
  </script>
</body>
</html>
