<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" shape-rendering="crispEdges">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#14233c" />
      <stop offset="60%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#05070c" />
    </radialGradient>
  </defs>

  <!-- App Rounded Frame -->
  <rect width="512" height="512" rx="108" fill="url(#bgGlow)" />
  <rect x="12" y="12" width="488" height="488" rx="96" fill="none" stroke="#223652" stroke-width="6" />

  <!-- Pixel Grid Backdrop (32x32 pixel cells) -->
  <g opacity="0.18" stroke="#38bdf8" stroke-width="2">
    <line x1="64" y1="64" x2="64" y2="448" />
    <line x1="128" y1="64" x2="128" y2="448" />
    <line x1="192" y1="64" x2="192" y2="448" />
    <line x1="256" y1="64" x2="256" y2="448" />
    <line x1="320" y1="64" x2="320" y2="448" />
    <line x1="384" y1="64" x2="384" y2="448" />
    <line x1="448" y1="64" x2="448" y2="448" />

    <line x1="64" y1="64" x2="448" y2="64" />
    <line x1="64" y1="128" x2="448" y2="128" />
    <line x1="64" y1="192" x2="448" y2="192" />
    <line x1="64" y1="256" x2="448" y2="256" />
    <line x1="64" y1="320" x2="448" y2="320" />
    <line x1="64" y1="384" x2="448" y2="384" />
    <line x1="64" y1="448" x2="448" y2="448" />
  </g>

  <!-- Keyframe Motion Diamond Path -->
  <!-- Left Keyframe Diamond (Previous) -->
  <g transform="translate(100, 310) rotate(45)">
    <rect x="-24" y="-24" width="48" height="48" fill="#132034" stroke="#df7126" stroke-width="6" />
    <rect x="-8" y="-8" width="16" height="16" fill="#fbf236" />
  </g>

  <!-- Central Keyframe Diamond (Active - Glowing) -->
  <g transform="translate(256, 256) rotate(45)">
    <rect x="-42" y="-42" width="84" height="84" fill="#1f2d48" stroke="#fbf236" stroke-width="8" />
    <rect x="-22" y="-22" width="44" height="44" fill="#df7126" stroke="#ffffff" stroke-width="4" />
    <rect x="-8" y="-8" width="16" height="16" fill="#ffffff" />
  </g>

  <!-- Right Keyframe Diamond (Next) -->
  <g transform="translate(412, 202) rotate(45)">
    <rect x="-24" y="-24" width="48" height="48" fill="#132034" stroke="#38bdf8" stroke-width="6" />
    <rect x="-8" y="-8" width="16" height="16" fill="#639bff" />
  </g>

  <!-- Dotted Motion Path -->
  <g stroke="#fbf236" stroke-width="4" stroke-dasharray="10 8" fill="none">
    <path d="M 100 310 Q 180 250, 256 256 T 412 202" />
  </g>

  <!-- 1. Onion Skin Trail: Magenta Ghost Frame -->
  <g transform="translate(160, 150)" opacity="0.4">
    <!-- Head -->
    <rect x="36" y="8" width="28" height="28" fill="#76428a" />
    <rect x="42" y="0" width="28" height="16" fill="#d95763" />
    <!-- Torso -->
    <rect x="24" y="36" width="36" height="44" fill="#76428a" />
    <!-- Arm -->
    <rect x="0" y="44" width="24" height="16" fill="#d95763" />
    <!-- Legs -->
    <rect x="16" y="80" width="18" height="40" fill="#76428a" />
    <rect x="40" y="80" width="24" height="32" fill="#d95763" />
  </g>

  <!-- 2. Onion Skin Trail: Cyan Ghost Frame -->
  <g transform="translate(200, 120)" opacity="0.65">
    <!-- Head -->
    <rect x="36" y="8" width="28" height="28" fill="#306082" />
    <rect x="42" y="0" width="28" height="16" fill="#5fcde4" />
    <!-- Torso -->
    <rect x="24" y="36" width="36" height="44" fill="#306082" />
    <!-- Arm -->
    <rect x="0" y="40" width="24" height="16" fill="#5fcde4" />
    <!-- Legs -->
    <rect x="16" y="80" width="18" height="40" fill="#306082" />
    <rect x="40" y="76" width="24" height="36" fill="#5fcde4" />
  </g>

  <!-- 3. Main Character Sprite (Articulated Pixel Hero in Motion) -->
  <g transform="translate(240, 90)">
    <!-- Helmet Hair / Crest (Orange & Gold) -->
    <rect x="36" y="-8" width="12" height="16" fill="#df7126" />
    <rect x="48" y="-16" width="16" height="20" fill="#fbf236" />
    <rect x="64" y="-8" width="14" height="14" fill="#df7126" />
    <rect x="78" y="0" width="10" height="10" fill="#df7126" />

    <!-- Head / Helmet -->
    <rect x="36" y="8" width="38" height="36" fill="#0b1a30" />
    <rect x="38" y="10" width="34" height="32" fill="#0284c7" />
    <rect x="52" y="18" width="20" height="16" fill="#ead4aa" />
    <rect x="64" y="22" width="6" height="8" fill="#000000" />
    <rect x="68" y="24" width="2" height="2" fill="#ffffff" />
    <!-- Ear joint / Pivot -->
    <rect x="32" y="22" width="8" height="10" fill="#fbf236" />

    <!-- Neck Joint -->
    <rect x="48" y="44" width="12" height="6" fill="#df7126" />

    <!-- Torso / Chest Armor (Cyan & Blue with SM Badge) -->
    <rect x="26" y="50" width="46" height="52" fill="#071424" />
    <rect x="28" y="52" width="42" height="48" fill="#0284c7" />
    <rect x="34" y="56" width="30" height="22" fill="#38bdf8" />
    <rect x="40" y="62" width="18" height="10" fill="#df7126" />
    <!-- "SM" Core -->
    <rect x="44" y="64" width="4" height="6" fill="#ffffff" />
    <rect x="52" y="64" width="4" height="6" fill="#ffffff" />
    <rect x="34" y="84" width="30" height="8" fill="#082f49" />
    <rect x="44" y="86" width="10" height="4" fill="#fbf236" />

    <!-- Left Arm (Reaching Forward) -->
    <!-- Shoulder Pivot Joint -->
    <circle cx="78" cy="58" r="8" fill="#fbf236" stroke="#000" stroke-width="2" />
    <!-- Forearm -->
    <rect x="86" y="52" width="36" height="12" fill="#df7126" />
    <rect x="88" y="54" width="32" height="8" fill="#fbf236" />
    <!-- Elbow Pivot Joint -->
    <circle cx="122" cy="58" r="6" fill="#fbf236" stroke="#000" stroke-width="2" />
    <!-- Hand / Glove -->
    <rect x="128" y="50" width="18" height="16" fill="#38bdf8" />
    <rect x="146" y="52" width="8" height="10" fill="#639bff" />

    <!-- Right Arm (Backswing) -->
    <circle cx="26" cy="62" r="8" fill="#fbf236" stroke="#000" stroke-width="2" />
    <rect x="-2" y="68" width="26" height="12" fill="#df7126" transform="rotate(30 10 70)" />
    <rect x="-14" y="84" width="16" height="14" fill="#38bdf8" />

    <!-- Left Leg (Knee Up / Leaping Forward) -->
    <!-- Hip Joint Pivot -->
    <circle cx="56" cy="106" r="8" fill="#fbf236" stroke="#000" stroke-width="2" />
    <!-- Thigh -->
    <rect x="60" y="112" width="16" height="34" fill="#0284c7" />
    <rect x="62" y="114" width="12" height="30" fill="#38bdf8" />
    <!-- Knee Joint Pivot -->
    <circle cx="68" cy="150" r="8" fill="#fbf236" stroke="#000" stroke-width="2" />
    <!-- Shin & Foot -->
    <rect x="62" y="156" width="16" height="36" fill="#df7126" />
    <rect x="64" y="158" width="12" height="32" fill="#fbf236" />
    <rect x="64" y="192" width="28" height="16" fill="#0284c7" />
    <rect x="66" y="194" width="24" height="12" fill="#38bdf8" />

    <!-- Right Leg (Trailing Backwards) -->
    <circle cx="34" cy="106" r="8" fill="#fbf236" stroke="#000" stroke-width="2" />
    <rect x="12" y="116" width="18" height="32" fill="#082f49" transform="rotate(40 24 120)" />
    <circle cx="10" cy="148" r="7" fill="#fbf236" stroke="#000" stroke-width="2" />
    <rect x="-16" y="162" width="16" height="36" fill="#082f49" transform="rotate(45 0 160)" />
    <rect x="-34" y="196" width="24" height="14" fill="#0284c7" />
  </g>

  <!-- Bottom Brand Title Pixel Banner -->
  <g transform="translate(76, 424)">
    <rect x="0" y="0" width="360" height="48" rx="8" fill="#0b1524" stroke="#1d3049" stroke-width="4" />
    <!-- Pixel Text: SPRITEMOTION -->
    <text x="180" y="32" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="3">
      SPRITEMOTION
    </text>
  </g>
</svg>
